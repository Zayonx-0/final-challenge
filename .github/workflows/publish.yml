name: Publish container

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify-publish:
    name: Verify, scan, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and verify application
        run: |
          npm ci
          npm run lint
          npm test
          npm run check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Task Management API
            org.opencontainers.image.description=Task API final platform engineering challenge

      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: task-api:release-candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify release candidate health
        run: |
          test "$(docker image inspect task-api:release-candidate --format '{{.Config.User}}')" = "node"
          container_id="$(docker run --detach --publish 127.0.0.1::3000 task-api:release-candidate)"
          trap 'docker rm --force "${container_id}" >/dev/null' EXIT
          port="$(docker port "${container_id}" 3000/tcp | awk -F: 'NR == 1 { print $NF }')"
          for attempt in {1..15}; do
            if curl --fail --silent --show-error "http://127.0.0.1:${port}/health"; then
              exit 0
            fi
            sleep 1
          done
          docker logs "${container_id}"
          exit 1

      - name: Scan release candidate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: task-api:release-candidate
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Report vulnerabilities in SARIF; do not block publication on
          # advisories inherited from the upstream runtime image.
          exit-code: "0"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
