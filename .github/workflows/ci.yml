name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }} quality gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 22
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check application entrypoint
        run: npm run check

  container:
    name: Build and scan container
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: task-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify non-root runtime and health endpoint
        run: |
          test "$(docker image inspect task-api:ci --format '{{.Config.User}}')" = "node"
          container_id="$(docker run --detach --publish 127.0.0.1::3000 task-api:ci)"
          trap 'docker rm --force "${container_id}" >/dev/null' EXIT
          port="$(docker port "${container_id}" 3000/tcp | awk -F: 'NR == 1 { print $NF }')"
          for attempt in {1..15}; do
            if curl --fail --silent --show-error "http://127.0.0.1:${port}/health"; then
              exit 0
            fi
            sleep 1
          done
          docker logs "${container_id}"
          exit 1

      - name: Scan image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: task-api:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload scan results to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
